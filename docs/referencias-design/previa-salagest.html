function planejamento(){return head('Planejamento pedagógico','Catálogo de cursos, módulos, UCs, turmas e carga horária.')+`<div class="sectionline"><div class="filters">${semester}<div class="tabset"><span class="tab on">Cursos</span><span class="tab">Módulos</span><span class="tab">Unidades curriculares</span><span class="tab">Ofertas / turmas</span></div></div>${act('Novo curso','plus')}</div><div class="kpis">${k('Cursos no cenário','6','Massa de testes','bluek','book')}${k('Capacidades','82','68 + 14 entre semestres','purplek','layers')}${k('UCs','Cadastro','CH total por UC','cyan','book')}${k('Ofertas / turmas','Cadastro','Instrutor e turno associados','greenk','users')}${k('UC sem CH fechada','1','Caso de teste previsto','amberk','alert')}${k('Calendário letivo','Oficial','Feriados e recessos','redk','calendar')}</div><div class="grid2">${panel('Cursos e estrutura curricular','Hierarquia Curso → Módulo → UC → Capacidades',`<table><thead><tr><th>Curso</th><th>Módulos</th><th>Unidades curriculares</th><th>Capacidades</th><th>Ação</th></tr></thead><tbody>${courses.map((c,i)=>`<tr><td class="tdstrong">${c}</td><td>Ver módulos</td><td>Ver UCs</td><td>${[12,16,14,13,15,12][i]}</td><td>${act('Detalhes','file',true)}</td></tr>`).join('')}</tbody></table>`)}<div style="display:grid;gap:12px;align-content:start">${panel('Oferta / turma','Campos que compõem o bloco de alocação',`<div class="formgrid" style="grid-template-columns:1fr 1fr"><label class="formfield">Curso<select><option>Técnico em Automação Industrial</option></select></label><label class="formfield">Módulo<select><option>Módulo II</option></select></label><label class="formfield">UC<select><option>Automação Industrial</option></select></label><label class="formfield">Docente<select><option>Docente 04</option></select></label><label class="formfield">Turma<input value="AUT-2026-02"/></label><label class="formfield">Turno<select><option>Tarde</option></select></label><label class="formfield">Alunos<input value="20"/></label><label class="formfield">Semestre<select><option>2026.2</option></select></label></div><div class="sectionline" style="margin-top:12px;margin-bottom:0">${tag('Estado: rascunho','amber')}${act('Salvar oferta','check')}</div>`)}${panel('Planejamento e validação','Exigências antes de publicar',`<div class="listrow"><span>CH de cada capacidade</span>${tag('Obrigatória > 0','red')}</div><div class="listrow"><span>Soma da CH da UC</span>${tag('Fechamento','amber')}</div><div class="listrow"><span>Recursos do ambiente</span>${tag('Compatibilidade','blue')}</div><div class="listrow"><span>Calendário da turma</span>${tag('Dias letivos','blue')}</div>`)}</div></div><div class="pagefoot">${note}</div>`}
function administracao(){return head('Administração','Configurações, permissões e rastreabilidade da gestão pedagógica.')+`<div class="sectionline"><div class="filters">${tag('Acesso: Gestor/Admin','blue')}${tag('Auditoria obrigatória','purple')}</div>${act('Exportar logs','download',true)}</div><div class="grid3">${[['Usuários e permissões','Perfis: gestor, coordenador, instrutor e consulta; autorizar por ação.','users'],['Calendário letivo','Datas de semestre, feriados, recessos e dias não letivos.','calendar'],['Parâmetros do sistema','CH por turno, semanas, gargalo, oportunidade e carga contratual.','settings'],['Auditoria e histórico','Registro de alterações, publicações e movimentos; antes/depois.','file'],['Importação e exportação','Planilhas de ambientes, docentes, capacidades, cursos e ofertas.','upload'],['Compatibilidade','Catálogo de recursos, requisitos críticos e sugestão de ambientes.','layers']].map(x=>`<div class="cardlink"><div class="badgecircle">${icon(x[2],25)}</div><div><b>${x[0]}</b><p>${x[1]}</p></div></div>`).join('')}</div><div class="grid2 equal" style="margin-top:14px">${panel('Parâmetros de referência','Configurações devem ser editáveis, não constantes fixas',`<div class="listrow"><span>Horas por turno</span><strong>4 h</strong></div><div class="listrow"><span>Dias letivos por semana</span><strong>5</strong></div><div class="listrow"><span>Semanas no semestre</span><strong>20</strong></div><div class="listrow"><span>Gargalo</span>${tag('≥ 85%','red')}</div><div class="listrow"><span>Oportunidade</span>${tag('< 40%','green')}</div><div class="listrow"><span>Carga de referência</span><strong>800 h / semestre</strong></div>`)}${panel('Segurança e decisões institucionais','Requisitos de produção e decisões ainda em aberto',`<div class="listrow"><span>Autenticação corporativa</span>${tag('SSO','blue')}</div><div class="listrow"><span>CPF em repouso e exibição</span>${tag('Protegido e mascarado','green')}</div><div class="listrow"><span>Aprovação e publicação</span>${tag('Definir responsável','amber')}</div><div class="listrow"><span>Conflito de instrutor</span>${tag('Política a definir','amber')}</div><div class="listrow"><span>Fonte de verdade das horas</span>${tag('Validar D-03','amber')}</div><div class="info">As decisões D-01 a D-08 exigem validação do gestor e setores responsáveis; esta prévia não as considera resolvidas.</div>`)}</div><div class="pagefoot">${note}</div>`}
const pages={dashboard,cronograma,instrutores,alocacao,capacidades,docentes,ambientes,relatorios,planejamento,administracao};function render(){let p=location.hash.slice(1)||'dashboard';if(!pages[p])p='dashboard';document.getElementById('sidebar').innerHTML=sidebar(p);document.getElementById('main').innerHTML=pages[p]();document.getElementById('urlpart').textContent=p;document.title='SalaGest | '+links.find(l=>l[0]===p)[1]};window.addEventListener('hashchange',render);render();
</script></body></html>
